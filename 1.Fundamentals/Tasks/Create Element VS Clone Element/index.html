<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create vs Clone Element Example</title>

</head>

<body>

    <!-- Existing element to clone -->
    <div id="original-box" class="box" style="padding: 10px; border: 2px solid blue; margin-bottom: 10px;">
        <h2>Original Box</h2>
        <p>This paragraph and heading exist inside the original element.</p>
    </div>

    <hr>

    <!-- Container for DOM outputs -->
    <div id="container"></div>

    <script src="index.js"></script>

</body>

</html>
